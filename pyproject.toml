[project]
name = "ehr-media-intelligence"
version = "0.1.0"
description = "EHR media intelligence: ingestion, FHIR, summarization, and semantic search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "python-dateutil>=2.9.0",
    "fhir.resources>=7.0.0",
    "anthropic>=0.39.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sentence-transformers>=3.3.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
ehr-fhir = "ehr_media.fhir_cli:main"
ehr-summarize = "ehr_media.summarization_cli:main"
ehr-index = "ehr_media.search_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]